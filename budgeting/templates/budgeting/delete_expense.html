<!DOCTYPE html>
<html>
<head>
    <title>Delete Expense</title>
</head>

<body>

<h1>Delete Expense</h1>

<p>
    Are you sure you want to delete this expense?
</p>

<p>
    <strong>{{ expense.category }}</strong>
    - {{ expense.amount }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'dashboard' %}">Cancel</a>
</form>

</body>
</html>
