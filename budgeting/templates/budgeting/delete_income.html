<!DOCTYPE html>
<html>
<head>
    <title>Delete Income</title>
</head>

<body>

<h1>Delete Income</h1>

<p>
    Are you sure you want to delete this income?
</p>

<p>
    <strong>{{ income.source }}</strong>
    - {{ income.amount }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'dashboard' %}">Cancel</a>
</form>

</body>
</html>
